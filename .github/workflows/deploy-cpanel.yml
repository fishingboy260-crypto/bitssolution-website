# Publishes the site to ServerFreak cPanel (public_html) whenever main changes.
# Work happens on branches; merging a pull request into main = "publish".
name: Publish to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only uploads changed files, and never deletes files it didn't upload
      # (so server-only folders like crewdesk-demo/ are left alone).
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .htaccess
            _headers
            css.zip
            README.md
